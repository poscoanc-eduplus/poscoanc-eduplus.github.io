    <!-- 시연용 프로토타입이라 검색에 잡히지 않게 한다. 주소를 받은 사람만 열도록. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>포스코A&C Edu+</title>
    <script>
      // 정적 공개판(GitHub Pages)에서는 /app/admin 같은 주소를 사이트의 404.html 이
      // /app/?__spa=/admin 으로 돌려보낸다. 라우터가 뜨기 전에 원래 주소로 되돌린다.
      (function () {
        var p = new URLSearchParams(location.search).get('__spa');
        if (p) history.replaceState(null, '', location.pathname.replace(/\/$/, '') + p + location.hash);
      })();
    </script>
